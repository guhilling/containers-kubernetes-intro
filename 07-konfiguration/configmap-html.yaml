apiVersion: v1
kind: ConfigMap
metadata:
  name: html-content
  labels:
    app: demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="de">
      <head><meta charset="UTF-8"><title>Demo App</title></head>
      <body>
        <h1>Hallo von Kubernetes!</h1>
        <p>Konfiguration über ConfigMap.</p>
      </body>
    </html>
  info.html: |
    <!DOCTYPE html>
    <html lang="de">
      <head><meta charset="UTF-8"><title>Info</title></head>
      <body>
        <h1>Seminar: Container und Kubernetes</h1>
        <p>Diese Seite wird aus einer ConfigMap ausgeliefert.</p>
      </body>
    </html>
