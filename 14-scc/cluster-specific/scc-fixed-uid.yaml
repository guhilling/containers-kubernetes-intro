apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: demo-fixed-uid
  labels:
    app: demo
# Referenz-Manifest: Anlegen erfordert Cluster-Admin-Rechte.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
readOnlyRootFilesystem: false
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAsRange
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1001
      max: 1001
users: []
groups: []
