apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 6
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      topologySpreadConstraints:
        # Gleichmäßig über die Availability Zones – harte Regel
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor     # Zonen mit nur "gesperrten" Nodes (Taints) nicht mitzählen
          labelSelector:
            matchLabels:
              app: demo
        # Innerhalb der Zonen möglichst auf verschiedene Nodes – weiche Regel
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: demo
      containers:
        - name: demo
          image: quay.io/ghilling/quarkus-demo:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
