apiVersion: batch/v1
kind: Job
metadata:
  name: demo-check-failing
  labels:
    app: demo-job
spec:
  backoffLimit: 2             # 1 Versuch + 2 Wiederholungen, dann "Failed"
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: demo-job
    spec:
      restartPolicy: Never    # jeder Versuch ist ein neuer Pod (bei OnFailure: Neustart im selben Pod)
      containers:
        - name: check
          image: quay.io/ghilling/ubi-tools:10-latest
          # Diese Seite gibt es nicht → curl -f liefert einen Fehler
          command: ["curl", "-sf", "http://demo:8080/gibt-es-nicht.html"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
