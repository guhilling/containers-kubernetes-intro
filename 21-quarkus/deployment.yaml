apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      # Muss größer sein als Shutdown-Delay (5 s) + Shutdown-Timeout (10 s) der Anwendung
      terminationGracePeriodSeconds: 30
      containers:
        - name: demo
          image: quay.io/ghilling/quarkus-demo:1.2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Probes auf die Endpunkte von SmallRye Health
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            periodSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config     # Quarkus liest <Arbeitsverzeichnis>/config/application.properties
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: demo-config
