quarkus.http.port=8080
quarkus.banner.enabled=false

# Verzeichnis, aus dem Dateien ausgeliefert werden (Umgebungsvariable: DEMO_HTML_DIR)
demo.html-dir=/var/demo/html
# Nachricht in /info (Umgebungsvariable: DEMO_MESSAGE, oder config/application.properties)
demo.message=Hallo aus der Demo-App

# Version der Anwendung (Umgebungsvariable: DEMO_VERSION, wird im Containerfile gesetzt)
demo.version=dev

%test.demo.html-dir=src/test/resources/html
%dev.demo.html-dir=src/test/resources/html

# Graceful Shutdown (Kapitel 21): Nach SIGTERM meldet /q/health/ready sofort DOWN, die Anwendung
# nimmt aber noch 5 s lang Anfragen an (bis der Pod aus den Service-Endpoints entfernt ist)
# und wartet danach bis zu 10 s auf laufende Anfragen.
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=5s
quarkus.shutdown.timeout=10s
