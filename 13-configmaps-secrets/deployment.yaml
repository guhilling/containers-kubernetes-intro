apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: quay.io/ghilling/quarkus-demo:1.1
          ports:
            - containerPort: 8080
          env:
            - name: DEMO_SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: password
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: html-content
              mountPath: /var/demo/html
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: html-content
          configMap:
            name: html-content
